<!DOCTYPE html>
<html>
<head>
    <title>CLaMP — Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;

            background-color: #F4F1FB;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }


        .login-card {
            width: 100vw;
            height: 100vh;

            background-color: #F4F1FB;

            border-radius: 0;

            position: relative;
            overflow: hidden;

            display: grid;
            grid-template-columns: 1fr 1.15fr;

            box-shadow: none;
        }


        /* =========================
           BRAND
        ========================== */

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            position: absolute;
            top: 40px;
            left: 70px;

            z-index: 10;
        }

        .brand-logo {
            width: 46px;
            height: 46px;

            object-fit: contain;

            filter: drop-shadow(0 4px 10px rgba(111, 98, 168, 0.25));
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;

            color: #2B1E4C;
        }

        .brand-name .highlight {
            color: #6F62A8;
        }


        /* =========================
           LEFT SIDE
        ========================== */

        .login-left {
            padding: 75px 70px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            position: relative;
            z-index: 5;
        }


        .login-left h1 {
            font-size: 36px;
            font-weight: 700;

            color: #2B1E4C;

            margin-bottom: 12px;
            line-height: 1.15;

            letter-spacing: -0.5px;
        }


        .login-left .subtitle {
            font-size: 14px;

            color: #8B84A0;

            margin-bottom: 42px;

            line-height: 1.5;
        }


        /* =========================
           INPUT GROUP
        ========================== */

        .input-group {
            position: relative;
            width: 100%;

            margin-bottom: 18px;
        }


        .input-icon {
            position: absolute;

            left: 22px;
            top: 50%;

            transform: translateY(-50%);

            width: 20px;
            height: 20px;

            color: #8B84A0;

            pointer-events: none;

            z-index: 2;
        }


        .input-group input {
            width: 100%;

            padding: 18px 22px 18px 56px;

            background-color: #FFFFFF;

            border: 1.5px solid #ECE5FA;

            border-radius: 50px;

            font-size: 14px;

            color: #2B1E4C;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background-color 0.2s;
        }


        .input-group input::placeholder {
            color: #A79FBC;
        }


        .input-group input:focus {
            background-color: #FFFFFF;

            border-color: #6F62A8;

            box-shadow:
                0 0 0 4px rgba(111, 98, 168, 0.15);
        }


        /* PASSWORD TOGGLE */

        .toggle-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 42px;
            height: 42px;

            background: transparent;
            border: none;

            color: #8B84A0;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            z-index: 2;

            transition: 0.2s;
        }


        .toggle-password:hover {
            color: #6F62A8;
            background-color: #F4F1FB;
        }


        .eye-icon {
            width: 20px;
            height: 20px;

            fill: none;
            stroke: currentColor;
            stroke-width: 2;    
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s ease, color 0.2s ease;
        }


        /* =========================
           ERROR / SUCCESS
        ========================== */

        .input-error {
            border-color: #ff3333 !important;
            background-color: #FFF5F5 !important;

            box-shadow:
                0 0 0 4px rgba(255, 51, 51, 0.10) !important;

            animation: shake 0.35s ease;
        }


        .input-valid {
            border-color: #00c853 !important;
            background-color: #F5FFF9 !important;

            box-shadow:
                0 0 0 4px rgba(0, 200, 83, 0.10) !important;
        }


        @keyframes shake {

            0%   { transform: translateX(0); }
            20%  { transform: translateX(-6px); }
            40%  { transform: translateX(6px); }
            60%  { transform: translateX(-6px); }
            80%  { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }


        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-button {
            width: 220px;

            padding: 17px 24px;

            margin-top: 16px;

            background: linear-gradient(135deg, #8478B8 0%, #6F62A8 100%);

            color: #FFFFFF;

            border: none;
            border-radius: 50px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            transition: 0.25s;

            box-shadow:
                0 12px 25px rgba(111, 98, 168, 0.35);
        }


        .login-button:hover {
            background: linear-gradient(135deg, #6F62A8 0%, #5A4F8F 100%);

            transform: translateY(-2px);

            box-shadow:
                0 16px 30px rgba(111, 98, 168, 0.45);
        }


        .login-button:active {
            transform: translateY(0);
        }


        .login-button svg {
            width: 18px;
            height: 18px;

            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =========================
           LOGIN MESSAGE
        ========================== */

        .login-message {
            margin-top: 16px;

            font-size: 13px;

            min-height: 18px;

            color: #ff3333;

            opacity: 0;

            transition: 0.2s;
        }


        .login-message.show {
            opacity: 1;
        }


        /* =========================
           RIGHT SIDE
        ========================== */

        .login-right {
            position: relative;

            overflow: hidden;
        }


        .login-right .curve-svg {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }


        .login-right .pc-image {
            position: absolute;

            right: -5%;
            bottom: 8%;

            width: 130%;
            max-width: 850px;

            z-index: 2;

            filter:
                drop-shadow(0 30px 50px rgba(40, 20, 90, 0.35));
        }


        /* =========================
           ENTRANCE ANIMATIONS
        ========================== */

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUpPC {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Apply animations --- */

        .brand {
            animation: slideInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
        }

        .login-left h1 {
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .login-left .subtitle {
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
        }

        .login-left .input-username {
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
        }

        .login-left .input-password {
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
        }

        .login-left .input-password .toggle-password {
            animation: fadeIn 0.5s ease 0.7s both;
        }

        .login-left .login-message {
            animation: fadeIn 0.5s ease 0.55s both;
        }

        .login-left .login-button {
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;
        }

        .login-right {
            animation: slideInRight 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        .login-right .pc-image {
            animation: fadeUpPC 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 950px) {

            .login-card {
                grid-template-columns: 1fr;
            }


            .login-right {
                display: none;
            }


            .login-left {
                padding: 55px 40px;
            }

            .brand {
                top: 25px;
                left: 30px;
            }

        }


        @media (max-width: 500px) {

            .login-left { padding: 40px 25px; }

            .login-left h1 { font-size: 26px; }

            .login-button { width: 100%; }

            .brand-logo { width: 38px; height: 38px; }

            .brand-name { font-size: 20px; }

        }

    </style>
</head>


<body>


    <div class="login-card">


        <div class="login-left">

            <!-- BRAND -->

            <div class="brand">

                <img
                    src="/static/clamp-logo.png"
                    alt="CLaMP"
                    class="brand-logo"
                >

                <span class="brand-name">
                    CL<span class="highlight">a</span>MP
                </span>

            </div>


            <h1>
                Welcome to CLaMP
            </h1>

            <p class="subtitle">
                Log in by entering the information below
            </p>


            <!-- USERNAME -->

            <div class="input-group input-username">

                <svg
                    class="input-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>


                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group input-password">

                <svg
                    class="input-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>


                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                >


                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Show password"
                >

                    <svg
                        class="eye-icon"
                        id="eyeIcon"
                        viewBox="0 0 24 24"
                    >
                        <!-- OPEN EYE (Default) -->
                        <g id="eyeOpen">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </g>
                        
                        <!-- CLOSED EYE (Hidden by default) -->
                        <g id="eyeClosed" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </g>
                    </svg>

                </button>

            </div>


            <div
                id="loginMessage"
                class="login-message"
            >
            </div>


            <button
                class="login-button"
                onclick="loginUser()"
            >

                Login

                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>

            </button>

        </div>


        <div class="login-right">

            <svg
                class="curve-svg"
                viewBox="0 0 660 640"
                preserveAspectRatio="none"
                xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <linearGradient
                        id="purpleGrad"
                        x1="0%"
                        y1="0%"
                        x2="60%"
                        y2="100%"
                    >

                        <stop offset="0%"   stop-color="#8478B8" />
                        <stop offset="50%"  stop-color="#6F62A8" />
                        <stop offset="100%" stop-color="#5A4F8F" />

                    </linearGradient>


                    <linearGradient
                        id="lavenderGrad"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%"
                    >

                        <stop offset="0%"   stop-color="#DCD6EC" />
                        <stop offset="50%"  stop-color="#CEC6E3" />
                        <stop offset="100%" stop-color="#C0B7DA" />

                    </linearGradient>

                </defs>


                <path
                    d="M 100,0
                       C 100,120 20,240 20,320
                       C 20,400 100,520 100,640
                       L 260,640
                       C 260,520 180,400 180,320
                       C 180,240 260,120 260,0
                       Z"
                    fill="url(#lavenderGrad)"
                />


                <path
                    d="M 260,0
                       C 260,120 180,240 180,320
                       C 180,400 260,520 260,640
                       L 660,640
                       L 660,0
                       Z"
                    fill="url(#purpleGrad)"
                />

            </svg>


            <img
                src="/static/pc-setup.png"
                alt=""
                class="pc-image"
            >

        </div>


    </div>



    <script>

        const username = document.getElementById("username");
        const password = document.getElementById("password");
        const loginMessage = document.getElementById("loginMessage");
        const togglePassword = document.getElementById("togglePassword");


        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                /* SHOW PASSWORD */
                password.type = "text";
                togglePassword.setAttribute("aria-label", "Hide password");

                /* Swap Icons */
                eyeOpen.style.display = "none";
                eyeClosed.style.display = "block";

            } else {

                /* HIDE PASSWORD */
                password.type = "password";
                togglePassword.setAttribute("aria-label", "Show password");

                /* Swap Icons */
                eyeOpen.style.display = "block";
                eyeClosed.style.display = "none";

            }

        });


        username.addEventListener("input", function () {

            if (username.value.trim() !== "") {

                username.classList.remove("input-error");
                username.classList.remove("input-valid");

            } else {

                username.classList.remove("input-valid");

            }

            loginMessage.classList.remove("show");

        });


        password.addEventListener("input", function () {

            if (password.value !== "") {

                password.classList.remove("input-error");
                password.classList.remove("input-valid");

            } else {

                password.classList.remove("input-valid");

            }

            loginMessage.classList.remove("show");

        });


        async function loginUser() {

            let valid = true;


            if (username.value.trim() === "") {

                username.classList.remove("input-valid");
                username.classList.add("input-error");

                valid = false;

            } else {

                username.classList.remove("input-error");
                username.classList.remove("input-valid");

            }


            if (password.value === "") {

                password.classList.remove("input-valid");
                password.classList.add("input-error");

                valid = false;

            } else {

                password.classList.remove("input-error");
                password.classList.remove("input-valid");

            }


            if (!valid) {

                loginMessage.innerText = "Please fill in all fields.";
                loginMessage.classList.add("show");

                return;

            }


            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: { "Content-Type": "application/json" },

                    body: JSON.stringify({
                        username: username.value.trim(),
                        password: password.value
                    })

                });


                const result = await response.json();


                if (result.success) {

                    username.classList.remove("input-error");
                    username.classList.add("input-valid");

                    password.classList.remove("input-error");
                    password.classList.add("input-valid");

                    window.location.href = "/dashboard";

                } else {

                    username.classList.remove("input-valid");
                    username.classList.add("input-error");

                    password.classList.remove("input-valid");
                    password.classList.add("input-error");

                    loginMessage.innerText = "Invalid username or password.";
                    loginMessage.classList.add("show");

                }

            }

            catch (error) {

                console.error(error);

                username.classList.remove("input-valid");
                password.classList.remove("input-valid");

                username.classList.add("input-error");
                password.classList.add("input-error");

                loginMessage.innerText = "Something went wrong. Please try again.";
                loginMessage.classList.add("show");

            }

        }

    </script>

</body>
</html>
