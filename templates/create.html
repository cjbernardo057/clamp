<!DOCTYPE html>
<html>
<head>
    <title>CLaMP — Create Account</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;

            background-color: #F4F1FB;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }


        .create-card {
            width: 100vw;
            height: 100vh;

            background-color: #F4F1FB;

            position: relative;
            overflow: hidden;

            display: grid;
            grid-template-columns: 1fr 1.15fr;

            box-shadow: none;
        }


        /* =========================
           BRAND
        ========================== */

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            position: absolute;
            top: 40px;
            left: 70px;

            z-index: 10;
        }

        .brand-logo {
            width: 46px;
            height: 46px;

            object-fit: contain;

            filter: drop-shadow(0 4px 10px rgba(111, 98, 168, 0.25));
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;

            color: #2B1E4C;
        }

        .brand-name .highlight {
            color: #6F62A8;
        }


        /* =========================
           LEFT SIDE — FORM
        ========================== */

        .create-left {
            padding: 130px 70px 60px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            position: relative;
            z-index: 5;

            overflow-y: auto;

            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .create-left::-webkit-scrollbar {
            display: none;
        }


        .create-left h1 {
            font-size: 32px;
            font-weight: 700;

            color: #2B1E4C;

            margin-bottom: 10px;
            line-height: 1.15;

            letter-spacing: -0.5px;
        }


        .create-left .subtitle {
            font-size: 13px;

            color: #8B84A0;

            margin-bottom: 30px;

            line-height: 1.5;
        }


        /* =========================
           INPUT GROUP
        ========================== */

        .input-group {
            position: relative;
            width: 100%;

            margin-bottom: 14px;
        }


        .input-group input {
            width: 100%;

            padding: 15px 20px;

            background-color: #FFFFFF;

            border: 1.5px solid #ECE5FA;

            border-radius: 50px;

            font-size: 13px;

            color: #2B1E4C;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background-color 0.2s;
        }


        .input-group input::placeholder {
            color: #A79FBC;
        }


        .input-group input:focus {
            border-color: #6F62A8;

            box-shadow:
                0 0 0 4px rgba(111, 98, 168, 0.15);
        }


        /* =========================
           INPUT STATES
        ========================== */

        .input-valid {
            border-color: #00c853 !important;
            background-color: #F5FFF9 !important;

            box-shadow:
                0 0 0 4px rgba(0, 200, 83, 0.10) !important;
        }


        .input-error {
            border-color: #ff3333 !important;
            background-color: #FFF5F5 !important;

            box-shadow:
                0 0 0 4px rgba(255, 51, 51, 0.10) !important;

            animation: shake 0.35s ease;
        }


        @keyframes shake {
            0%   { transform: translateX(0); }
            20%  { transform: translateX(-6px); }
            40%  { transform: translateX(6px); }
            60%  { transform: translateX(-6px); }
            80%  { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }


        /* =========================
           PASSWORD REQUIREMENTS
        ========================== */

        .requirements {
            width: 100%;

            margin-top: 4px;
            margin-bottom: 14px;

            padding-left: 20px;

            font-size: 12px;

            display: none;
        }


        .requirements.show {
            display: block;
        }


        .requirement {
            margin: 4px 0;

            transition: 0.3s;
        }


        .requirement.invalid {
            color: #ff3333;
        }


        .requirement.valid {
            color: #00aa44;
        }


        /* =========================
           CREATE BUTTON
        ========================== */

        .create-button {
            width: 100%;

            padding: 16px;

            margin-top: 8px;

            background: linear-gradient(135deg, #8478B8 0%, #6F62A8 100%);

            color: #FFFFFF;

            border: none;
            border-radius: 50px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            transition: 0.25s;

            box-shadow:
                0 12px 25px rgba(111, 98, 168, 0.35);
        }


        .create-button:hover {
            background: linear-gradient(135deg, #6F62A8 0%, #5A4F8F 100%);

            transform: translateY(-2px);

            box-shadow:
                0 16px 30px rgba(111, 98, 168, 0.45);
        }


        .create-button:active {
            transform: translateY(0);
        }


        .create-button svg {
            width: 18px;
            height: 18px;

            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =========================
           BACK LINK
        ========================== */

        .back-button {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #8B84A0;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }


        .back-button:hover {
            color: #6F62A8;
        }


        /* =========================
           RIGHT SIDE — SVG + PC
        ========================== */

        .create-right {
            position: relative;

            overflow: hidden;
        }


        .create-right .curve-svg {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }


        .create-right .pc-image {
            position: absolute;

            right: 0%;
            bottom: 8%;

            width: 100%;
            max-width: 720px;

            z-index: 2;

            filter:
                drop-shadow(0 30px 50px rgba(40, 20, 90, 0.35));
        }


        /* =========================
           SUCCESS POPUP
        ========================== */

        .success-popup {
            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%) scale(0.7);

            background: #FFFFFF;

            border: 2px solid #6F62A8;

            border-radius: 20px;

            width: 340px;

            padding: 32px;

            text-align: center;

            color: #2B1E4C;

            box-shadow:
                0 0 20px rgba(111, 98, 168, 0.5),
                0 0 50px rgba(111, 98, 168, 0.25);

            opacity: 0;

            visibility: hidden;

            z-index: 9999;
        }


        .success-popup.show {
            visibility: visible;

            animation:
                popupShow 0.5s ease forwards;
        }


        .success-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 3px solid #6F62A8;
            border-radius: 50%;

            color: #6F62A8;

            font-size: 40px;
            font-weight: bold;

            box-shadow:
                0 0 15px rgba(111, 98, 168, 0.5),
                inset 0 0 10px rgba(111, 98, 168, 0.15);
        }


        .success-popup h2 {
            margin: 5px 0;

            color: #6F62A8;
        }


        .success-popup p {
            margin-top: 10px;

            color: #777080;

            font-size: 13px;
        }


        @keyframes popupShow {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.6);
            }
            70% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }


        /* =========================
           ENTRANCE ANIMATIONS
        ========================== */

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeUpPC {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* --- Apply animations --- */

        .brand {
            animation: slideInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
        }

        .create-left h1 {
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .create-left .subtitle {
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.22s both;
        }

        .create-left .input-firstname {
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.30s both;
        }

        .create-left .input-lastname {
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.37s both;
        }

        .create-left .input-username {
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.44s both;
        }

        .create-left .input-email {
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.51s both;
        }

        .create-left .input-password {
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.58s both;
        }

        .create-left .requirements {
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.62s both;
        }

        .create-left .input-confirm {
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.68s both;
        }

        .create-left .create-button {
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.78s both;
        }

        .create-left .back-button {
            animation: slideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.88s both;
        }

        .create-right {
            animation: slideInRight 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        .create-right .pc-image {
            animation: fadeUpPC 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 950px) {

            .create-card {
                grid-template-columns: 1fr;
            }


            .create-right {
                display: none;
            }


            .create-left {
                padding: 110px 40px 50px;
            }

            .brand {
                top: 25px;
                left: 30px;
            }

        }


        @media (max-width: 500px) {

            .create-left {
                padding: 100px 25px 40px;
            }

            .create-left h1 {
                font-size: 24px;
            }

            .brand-logo { width: 38px; height: 38px; }

            .brand-name { font-size: 20px; }

        }

    </style>
</head>


<body>


    <div class="create-card">


        <!-- =========================
             LEFT — FORM
        ========================== -->

        <div class="create-left">

            <!-- BRAND -->

            <div class="brand">

                <img
                    src="/static/clamp-logo.png"
                    alt="CLaMP"
                    class="brand-logo"
                >

                <span class="brand-name">
                    CL<span class="highlight">a</span>MP
                </span>

            </div>


            <h1>
                Add User
            </h1>

            <p class="subtitle">
                Fill in the details below to register a new user.
            </p>


            <div class="input-group input-firstname">
                <input
                    type="text"
                    id="firstname"
                    placeholder="First Name"
                >
            </div>


            <div class="input-group input-lastname">
                <input
                    type="text"
                    id="lastname"
                    placeholder="Last Name"
                >
            </div>


            <div class="input-group input-username">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                >
            </div>


            <div class="input-group input-email">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                >
            </div>


            <div class="input-group input-password">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                >
            </div>


            <!-- PASSWORD REQUIREMENTS -->

            <div
                id="passwordRequirements"
                class="requirements"
            >

                <div
                    id="lengthRequirement"
                    class="requirement invalid"
                >
                    ✖ At least 8 characters
                </div>

                <div
                    id="specialRequirement"
                    class="requirement invalid"
                >
                    ✖ At least 1 special character (/ _ !)
                </div>

            </div>


            <div class="input-group input-confirm">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                >
            </div>


            <!-- CREATE BUTTON -->

            <button
                class="create-button"
                onclick="createAccount()"
            >

                Add User

                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>

            </button>


            <a
                href="/dashboard"
                class="back-button"
            >
                Back to Dashboard
            </a>

        </div>


        <!-- =========================
             RIGHT — SVG + PC IMAGE
        ========================== -->

        <div class="create-right">

            <svg
                class="curve-svg"
                viewBox="0 0 660 640"
                preserveAspectRatio="none"
                xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <linearGradient
                        id="purpleGrad"
                        x1="0%"
                        y1="0%"
                        x2="60%"
                        y2="100%"
                    >
                        <stop offset="0%"   stop-color="#8478B8" />
                        <stop offset="50%"  stop-color="#6F62A8" />
                        <stop offset="100%" stop-color="#5A4F8F" />
                    </linearGradient>

                    <linearGradient
                        id="lavenderGrad"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%"
                    >
                        <stop offset="0%"   stop-color="#DCD6EC" />
                        <stop offset="50%"  stop-color="#CEC6E3" />
                        <stop offset="100%" stop-color="#C0B7DA" />
                    </linearGradient>

                </defs>


                <path
                    d="M 100,0
                       C 100,120 20,240 20,320
                       C 20,400 100,520 100,640
                       L 260,640
                       C 260,520 180,400 180,320
                       C 180,240 260,120 260,0
                       Z"
                    fill="url(#lavenderGrad)"
                />

                <path
                    d="M 260,0
                       C 260,120 180,240 180,320
                       C 180,400 260,520 260,640
                       L 660,640
                       L 660,0
                       Z"
                    fill="url(#purpleGrad)"
                />

            </svg>


            <img
                src="/static/pc-setup.png"
                alt=""
                class="pc-image"
            >

        </div>


    </div>



    <!-- ============================= -->
    <!-- SUCCESS POPUP -->
    <!-- ============================= -->

    <div
        id="successPopup"
        class="success-popup"
    >

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Account Created!
        </h2>

        <p>
            Your account has been successfully created.
        </p>

    </div>



    <script>

        const firstname = document.getElementById("firstname");
        const lastname = document.getElementById("lastname");
        const username = document.getElementById("username");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");

        const passwordRequirements = document.getElementById("passwordRequirements");
        const lengthRequirement = document.getElementById("lengthRequirement");
        const specialRequirement = document.getElementById("specialRequirement");


        const savedFields = [
            "firstname",
            "lastname",
            "username",
            "email",
            "password",
            "confirmPassword"
        ];


        savedFields.forEach(function (fieldName) {

            const field = document.getElementById(fieldName);

            if (field) {

                field.addEventListener("input", function () {

                    sessionStorage.setItem(fieldName, field.value);

                });

            }

        });


        function restoreFormData() {

            savedFields.forEach(function (fieldName) {

                const field = document.getElementById(fieldName);
                const savedValue = sessionStorage.getItem(fieldName);

                if (field && savedValue !== null) {

                    field.value = savedValue;

                }

            });


            if (password.value !== "") {

                password.dispatchEvent(new Event("input"));

            }


            if (confirmPassword.value !== "") {

                checkConfirmPassword();

            }

        }


        window.addEventListener("pageshow", function () {

            restoreFormData();

        });


        password.addEventListener("input", function () {

            const value = password.value;


            if (value.length > 0) {

                passwordRequirements.classList.add("show");

            }

            else {

                passwordRequirements.classList.remove("show");

                password.classList.remove("input-valid");
                password.classList.remove("input-error");

            }


            const lengthValid = value.length >= 8;

            if (lengthValid) {

                lengthRequirement.classList.remove("invalid");
                lengthRequirement.classList.add("valid");
                lengthRequirement.innerHTML = "✔ At least 8 characters";

            }

            else {

                lengthRequirement.classList.remove("valid");
                lengthRequirement.classList.add("invalid");
                lengthRequirement.innerHTML = "✖ At least 8 characters";

            }


            const specialValid =
                value.includes("/") ||
                value.includes("_") ||
                value.includes("!");

            if (specialValid) {

                specialRequirement.classList.remove("invalid");
                specialRequirement.classList.add("valid");
                specialRequirement.innerHTML = "✔ At least 1 special character (/ _ !)";

            }

            else {

                specialRequirement.classList.remove("valid");
                specialRequirement.classList.add("invalid");
                specialRequirement.innerHTML = "✖ At least 1 special character (/ _ !)";

            }


            if (value.length > 0 && lengthValid && specialValid) {

                password.classList.remove("input-error");
                password.classList.add("input-valid");

            }

            else if (value.length > 0) {

                password.classList.remove("input-valid");
                password.classList.add("input-error");

            }


            checkConfirmPassword();

        });


        confirmPassword.addEventListener("input", function () {

            checkConfirmPassword();

        });


        function checkConfirmPassword() {

            const passwordValue = password.value;
            const confirmValue = confirmPassword.value;


            if (confirmValue === "") {

                confirmPassword.classList.remove("input-valid");
                confirmPassword.classList.remove("input-error");

                return;
            }


            if (passwordValue !== "" && confirmValue === passwordValue) {

                confirmPassword.classList.remove("input-error");
                confirmPassword.classList.add("input-valid");

            }

            else {

                confirmPassword.classList.remove("input-valid");
                confirmPassword.classList.add("input-error");

            }

        }


        function checkInput(input) {

            if (input.value.trim() !== "") {

                input.classList.remove("input-error");
                input.classList.add("input-valid");

                return true;

            }

            else {

                input.classList.remove("input-valid");
                input.classList.add("input-error");

                return false;
            }

        }


        async function createAccount() {

            let valid = true;


            if (!checkInput(firstname)) valid = false;
            if (!checkInput(lastname))  valid = false;
            if (!checkInput(username))  valid = false;
            if (!checkInput(email))     valid = false;


            const passwordValue = password.value;

            const passwordLengthValid = passwordValue.length >= 8;

            const passwordSpecialValid =
                passwordValue.includes("/") ||
                passwordValue.includes("_") ||
                passwordValue.includes("!");


            if (!passwordLengthValid || !passwordSpecialValid) {

                password.classList.remove("input-valid");
                password.classList.add("input-error");

                valid = false;

            }

            else {

                password.classList.remove("input-error");
                password.classList.add("input-valid");

            }


            if (confirmPassword.value === "" ||
                confirmPassword.value !== passwordValue) {

                confirmPassword.classList.remove("input-valid");
                confirmPassword.classList.add("input-error");

                valid = false;

            }

            else {

                confirmPassword.classList.remove("input-error");
                confirmPassword.classList.add("input-valid");

            }


            if (!valid) return;


            const accountData = {

                firstname: firstname.value.trim(),
                lastname:  lastname.value.trim(),
                username:  username.value.trim(),
                email:     email.value.trim(),
                password:  passwordValue

            };


            try {

                const response = await fetch(
                    "/create-account",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(accountData)
                    }
                );


                const result = await response.json();


                if (result.success) {

                    savedFields.forEach(function (fieldName) {

                        sessionStorage.removeItem(fieldName);

                    });


                    const popup = document.getElementById("successPopup");

                    popup.classList.add("show");


                    setTimeout(function () {

                        window.location.href = "/";

                    }, 1800);

                }

                else {

                    alert(result.message);

                }

            }

            catch (error) {

                console.error(error);

                alert("Something went wrong. Please try again.");

            }

        }

    </script>

</body>
</html>
